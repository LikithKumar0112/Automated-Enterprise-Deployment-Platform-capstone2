apiVersion: v1
kind: Service
metadata:
  name: analytics-api
  namespace: analytics
  labels:
    app: analytics-api
spec:
  selector:
    app: analytics-api
  ports:
  - port: 80
    targetPort: 8080
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-web
  namespace: analytics
  labels:
    app: analytics-web
spec:
  selector:
    app: analytics-web
  ports:
  - port: 80
    targetPort: 8080
    name: http
  type: ClusterIP
