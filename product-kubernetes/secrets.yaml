# Reference only: documents the keys in api-secrets. Not applied by the pipeline.
# scripts/sync-secrets.sh builds the real Secret from AWS Secrets Manager.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: analytics
type: Opaque
stringData:
  DB_USERNAME: "REPLACE_AT_DEPLOY_TIME"
  DB_PASSWORD: "REPLACE_AT_DEPLOY_TIME"
  DB_URL: "REPLACE_AT_DEPLOY_TIME"
  JWT_SIGNING_KEY: "REPLACE_AT_DEPLOY_TIME"
