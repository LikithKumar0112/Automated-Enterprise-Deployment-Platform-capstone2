# Helm values for the kube-prometheus-stack chart (Prometheus + Alertmanager
# + Grafana). Applied per environment with:
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     -f monitoring/dashboards/kube-prometheus-stack-values.yaml \
#     --set grafana.adminPassword=$GRAFANA_PASSWORD

prometheus:
  prometheusSpec:
    retention: 30d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests: {storage: 100Gi}
    # Reference sizing (memory: 4Gi, cpu: 2) assumes real production nodes.
    # This account's node groups are capped at m7i-flex.large (2 vCPU/8GiB
    # total per node - see product-infrastructure/environments/*/*.tfvars),
    # so a 2-vCPU request can never be scheduled: confirmed via
    # `kubectl describe pod` showing "0/2 nodes are available: Insufficient
    # cpu" indefinitely, 2026-09-17. Right-sized to actually fit alongside
    # everything else already running on a 2-node cluster.
    resources:
      requests: {memory: 512Mi, cpu: 250m}
      limits: {memory: 1Gi, cpu: 500m}

  alertmanager:
    alertmanagerSpec:
      retention: 120h
      resources:
        requests: {memory: 256Mi, cpu: 200m}
        limits: {memory: 512Mi, cpu: 500m}

grafana:
  persistence:
    enabled: true
    storageClassName: gp2
    accessModes: ["ReadWriteOnce"]
    size: 10Gi
  dashboardsConfigMaps:
    default: "grafana-analytics-dashboard"
  resources:
    requests: {memory: 256Mi, cpu: 100m}
    limits: {memory: 512Mi, cpu: 200m}

alertmanagerFiles:
  alertmanager.yml:
    global:
      slack_api_url: ${SLACK_WEBHOOK_URL}
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'slack-notifications'
      routes:
      - match: {severity: critical}
        receiver: 'slack-critical'
        continue: true
      - match: {severity: warning}
        receiver: 'slack-warning'
    receivers:
    - name: 'slack-notifications'
      slack_configs:
      - channel: '#monitoring-alerts'
        send_resolved: true
    - name: 'slack-critical'
      slack_configs:
      - channel: '#operations-critical'
        send_resolved: true
    - name: 'slack-warning'
      slack_configs:
      - channel: '#operations-warnings'
        send_resolved: true

# `prometheusRule:` (bare top-level key) is not a recognized value path in
# this chart at all - Helm silently ignores unrecognized keys, so this rule
# group was never actually created as a PrometheusRule resource despite the
# chart being installed successfully every time (confirmed: no matching
# PrometheusRule existed even after re-running helm upgrade, 2026-09-17).
# additionalPrometheusRulesMap is the chart's real mechanism for injecting
# custom rule groups.
additionalPrometheusRulesMap:
  analytics-platform-rules:
    groups:
    - name: analytics-platform
      rules:
      - alert: HighErrorRate
        # http_requests_total doesn't exist - Spring Boot/Micrometer exposes
        # http_server_requests_seconds_count instead (confirmed via
        # analytics-api's own /actuator/prometheus output, 2026-09-17). The
        # original expr could never match anything, so this alert could never
        # fire regardless of real error rate.
        expr: |
          sum(rate(http_server_requests_seconds_count{job="analytics-api",status=~"5.."}[5m])) * 100 / sum(rate(http_server_requests_seconds_count{job="analytics-api"}[5m])) > 5
        for: 5m
        labels: {severity: critical, team: analytics}
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }}% for service {{ $labels.service }}"
      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 3
        for: 2m
        labels: {severity: warning, team: analytics}
        annotations:
          summary: "Container restarting too frequently"
          description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is restarting frequently"
      - alert: DeploymentStuck
        expr: kube_deployment_status_replicas_unavailable > 0
        for: 10m
        labels: {severity: critical, team: analytics}
        annotations:
          summary: "Deployment stuck with unavailable replicas"
          description: "Deployment {{ $labels.deployment }} has {{ $value }} unavailable replicas"
