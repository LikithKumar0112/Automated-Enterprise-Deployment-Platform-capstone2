apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: analytics-api
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - analytics
  selector:
    matchLabels:
      app: analytics-api
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
