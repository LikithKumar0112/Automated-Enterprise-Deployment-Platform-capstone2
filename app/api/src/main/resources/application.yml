# Bundled inside the jar - loaded regardless of which external profile file
# ends up next to it, so the app works correctly even independent of the
# application-prod.yml the Dockerfile copies into /app/config (see the note
# in that file about its profile-name mismatch with product-kubernetes/configmap.yaml).
server:
  port: 8080

spring:
  application:
    name: analytics-api

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
