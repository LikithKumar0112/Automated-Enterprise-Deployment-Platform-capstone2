# Minimal stub nginx config for analytics-web (see app/api/pom.xml for why
# this stub exists). Runs entirely as the non-root appuser (USER appuser in
# product-docker/Dockerfile, applied to the whole process incl. master), so:
#   - listens on 8080 (unprivileged port, no root needed to bind it)
#   - pid + all temp paths redirected to /tmp, which appuser can write to
#     (the Dockerfile only chowns /usr/share/nginx/html, not /var/run or
#     /var/cache/nginx)
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile    on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Target of ingress.yaml's alb.ingress.kubernetes.io/healthcheck-path
        location /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
